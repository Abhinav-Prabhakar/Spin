<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Spin architecture</title>
  <desc id="desc">Browsers talk to one Durable Object per room over WebSockets. The room stores audio and artwork in Workers KV and streams media back to every screen.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b9b9b1"/>
    </marker>
    <linearGradient id="room-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fcfcfa"/>
    </linearGradient>
  </defs>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="56" font-size="26" font-weight="650" letter-spacing="-0.035em" fill="#101010">One room, one clock</text>
    <text x="48" y="82" font-size="12.5" font-weight="450" letter-spacing="0.005em" fill="#92928b">Cloudflare Workers · Durable Objects · Workers KV</text>

    <!-- Browsers -->
    <rect x="48" y="126" width="300" height="252" rx="18" fill="#fbfbf9" stroke="#ececea"/>
    <text x="72" y="156" font-size="9.5" font-weight="600" letter-spacing="0.14em" fill="#a4a49d">BROWSERS</text>
    <text x="72" y="181" font-size="17" font-weight="600" letter-spacing="-0.02em" fill="#101010">Every screen</text>

    <g>
      <circle cx="84" cy="215" r="9" fill="#ea7b63"/>
      <text x="101" y="219" font-size="12" font-weight="520" fill="#2c2c29">abhinav</text>
      <g fill="#c9c9c2">
        <rect x="292" y="207" width="2.4" height="8" rx="1.2"/>
        <rect x="297" y="203" width="2.4" height="16" rx="1.2"/>
        <rect x="302" y="209" width="2.4" height="7" rx="1.2"/>
      </g>

      <circle cx="84" cy="257" r="9" fill="#b9cb8e"/>
      <text x="101" y="261" font-size="12" font-weight="520" fill="#2c2c29">sage</text>
      <g fill="#c9c9c2">
        <rect x="292" y="253" width="2.4" height="10" rx="1.2"/>
        <rect x="297" y="249" width="2.4" height="18" rx="1.2"/>
        <rect x="302" y="255" width="2.4" height="8" rx="1.2"/>
      </g>

      <circle cx="84" cy="299" r="9" fill="#9dbad6"/>
      <text x="101" y="303" font-size="12" font-weight="520" fill="#2c2c29">kite</text>
      <g fill="#c9c9c2">
        <rect x="292" y="295" width="2.4" height="7" rx="1.2"/>
        <rect x="297" y="291" width="2.4" height="14" rx="1.2"/>
        <rect x="302" y="297" width="2.4" height="8" rx="1.2"/>
      </g>
    </g>

    <text x="72" y="348" font-size="10.5" font-weight="450" fill="#a2a29b">no accounts · just a link</text>

    <!-- Room -->
    <rect x="450" y="126" width="300" height="252" rx="18" fill="url(#room-glow)" stroke="#dededa"/>
    <circle cx="726" cy="147" r="4.5" fill="#ff4b2b"/>
    <text x="474" y="156" font-size="9.5" font-weight="600" letter-spacing="0.14em" fill="#a4a49d">DURABLE OBJECT</text>
    <text x="474" y="181" font-size="17" font-weight="600" letter-spacing="-0.02em" fill="#101010">Room 6YS3XS</text>

    <g fill="#161615">
      <rect x="524" y="228" width="4" height="34" rx="2"/>
      <rect x="533" y="218" width="4" height="44" rx="2"/>
      <rect x="542" y="238" width="4" height="24" rx="2"/>
      <rect x="551" y="208" width="4" height="54" rx="2"/>
      <rect x="560" y="224" width="4" height="38" rx="2"/>
      <rect x="569" y="196" width="4" height="66" rx="2"/>
      <rect x="578" y="214" width="4" height="48" rx="2"/>
      <rect x="587" y="228" width="4" height="34" rx="2"/>
      <rect x="596" y="204" width="4" height="58" rx="2"/>
      <rect x="605" y="220" width="4" height="42" rx="2"/>
      <rect x="614" y="236" width="4" height="26" rx="2"/>
      <rect x="623" y="212" width="4" height="50" rx="2"/>
      <rect x="632" y="226" width="4" height="36" rx="2"/>
      <rect x="641" y="240" width="4" height="22" rx="2"/>
      <rect x="650" y="202" width="4" height="60" rx="2"/>
      <rect x="659" y="218" width="4" height="44" rx="2"/>
      <rect x="668" y="232" width="4" height="30" rx="2"/>
      <rect x="677" y="222" width="4" height="40" rx="2"/>
    </g>
    <text x="524" y="300" font-size="10.5" font-weight="450" fill="#9d9d96">authoritative clock · queue · presence</text>

    <g font-size="10" font-weight="500">
      <rect x="524" y="322" width="58" height="24" rx="12" fill="#f1f1ed"/>
      <text x="553" y="338" text-anchor="middle" fill="#6c6c65">play</text>
      <rect x="589" y="322" width="66" height="24" rx="12" fill="#f1f1ed"/>
      <text x="622" y="338" text-anchor="middle" fill="#6c6c65">seek</text>
      <rect x="662" y="322" width="64" height="24" rx="12" fill="#f1f1ed"/>
      <text x="694" y="338" text-anchor="middle" fill="#6c6c65">hearts</text>
    </g>

    <!-- KV -->
    <rect x="852" y="126" width="300" height="252" rx="18" fill="#fbfbf9" stroke="#ececea"/>
    <text x="876" y="156" font-size="9.5" font-weight="600" letter-spacing="0.14em" fill="#a4a49d">WORKERS KV</text>
    <text x="876" y="181" font-size="17" font-weight="600" letter-spacing="-0.02em" fill="#101010">Audio &amp; art</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#77776f">
      <g>
        <rect x="876" y="203" width="14" height="16" rx="3.5" fill="none" stroke="#d2d2ca"/>
        <path d="M884 203v5h5" fill="none" stroke="#d2d2ca"/>
        <text x="900" y="215">audio/6YS3XS/…/0</text>
      </g>
      <g>
        <rect x="876" y="235" width="14" height="16" rx="3.5" fill="none" stroke="#d2d2ca"/>
        <path d="M884 235v5h5" fill="none" stroke="#d2d2ca"/>
        <text x="900" y="247">art/6YS3XS/…</text>
      </g>
      <g>
        <rect x="876" y="267" width="14" height="16" rx="3.5" fill="none" stroke="#d2d2ca"/>
        <path d="M884 267v5h5" fill="none" stroke="#d2d2ca"/>
        <text x="900" y="279">meta/6YS3XS/…</text>
      </g>
    </g>

    <text x="876" y="328" font-size="10.5" font-weight="450" fill="#9d9d96">immutable · 20 MB chunks · range-ready</text>

    <!-- arrows -->
    <line x1="356" y1="212" x2="442" y2="212" stroke="#b9b9b1" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="399" y="199" text-anchor="middle" font-size="10" font-weight="550" letter-spacing="0.02em" fill="#82827a">wss</text>
    <text x="399" y="232" text-anchor="middle" font-size="9.5" font-weight="450" fill="#a4a49d">sync</text>

    <line x1="758" y1="212" x2="844" y2="212" stroke="#b9b9b1" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="801" y="199" text-anchor="middle" font-size="10" font-weight="550" letter-spacing="0.02em" fill="#82827a">store</text>
    <text x="801" y="232" text-anchor="middle" font-size="9.5" font-weight="450" fill="#a4a49d">chunks</text>

    <path d="M1002 378 L1002 420 L198 420 L198 386" fill="none" stroke="#b9b9b1" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="600" y="440" text-anchor="middle" font-size="10" font-weight="450" fill="#9d9d96">media · HTTP range · edge-cached</text>
  </g>
</svg>
